<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vyatirikht — One vision. Three worlds.</title>
  <meta name="description" content="Vyatirikht — the digital headquarters of Jitendra Kulkarni (MJ), Pune. Three worlds: Studio (film, photography, branding), Lab (software, AI, web) and Foundry (motorcycles, karate, experiments, new ideas).">
  <meta name="theme-color" content="#0E0F12">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://vyatirikht.xyz/">
  <link rel="icon" type="image/png" href="assets/images/logo/Logo_transparent.png">
  <link rel="apple-touch-icon" href="assets/images/logo/Logo_transparent.png">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://vyatirikht.xyz/">
  <meta property="og:title" content="Vyatirikht — One vision. Three worlds.">
  <meta property="og:description" content="Studio · Lab · Foundry — the three worlds of Jitendra Kulkarni (MJ), Pune.">
  <meta property="og:image" content="https://vyatirikht.xyz/assets/images/web/product-7.jpg">
  <meta property="og:site_name" content="Vyatirikht">

  <!-- Fonts & Styles — identical stack to the rest of the site -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400&family=Rozha+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Theme: light by default, dark only if opted in (runs before paint) -->
  <script>
    (function () {
      try { if (localStorage.getItem('vy-theme') === 'dark') document.documentElement.setAttribute('data-theme','dark'); } catch (e) {}
    })();
  </script>
</head>
<body class="gw-body">

<!-- Cinematic page-transition veil -->
<div class="page-veil" id="pageVeil" aria-hidden="true"></div>

<!-- ── GLOBAL NAV (persistent world switcher) ── -->
<nav class="gnav" id="gnav" aria-label="Worlds">
  <a href="index.html" class="gnav-logo" data-transition aria-label="Vyatirikht home">
    <img src="assets/images/logo/Logo_transparent.png" alt="Vyatirikht" width="217" height="363">
    <span>Vyatirikht</span>
  </a>
  <div class="gnav-links">
    <a href="studio.html" data-transition>Studio</a>
    <a href="lab.html" data-transition>Lab</a>
    <a href="foundry.html" data-transition>Foundry</a>
  </div>
</nav>

<!-- ── GATEWAY STAGE ── -->
<main class="gw-stage" id="gw-stage" aria-label="Vyatirikht">

  <!-- Ambient background: cycles through cinematic reels -->
  <video class="gw-stage-vid gw-vid"
         data-reels="assets/videos/web/bhagwati.mp4,assets/videos/web/karwa.mp4,assets/videos/web/cinematic.mp4,assets/videos/web/royalenfield.mp4"
         poster="assets/videos/poster/bhagwati.jpg"
         muted loop playsinline preload="none" aria-hidden="true"></video>
  <div class="gw-stage-scrim" aria-hidden="true"></div>

  <!-- Brand statement -->
  <div class="gw-stage-body">
    <p class="gw-stage-label">Digital Services · Pune, India</p>
    <h1 class="gw-stage-name">Vyatirikht</h1>
    <p class="gw-stage-tagline">Stories. Systems. Structures.</p>
  </div>

  <!-- Three-world selector strip -->
  <nav class="gw-worlds" aria-label="Three worlds">
    <a class="gw-world" href="studio.html" data-transition>
      <span class="gw-world-num">01</span>
      <span class="gw-world-name">Studio</span>
      <span class="gw-world-tags">Film · Photography · Branding</span>
      <svg class="gw-world-arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg>
    </a>
    <a class="gw-world" href="lab.html" data-transition>
      <span class="gw-world-num">02</span>
      <span class="gw-world-name">Lab</span>
      <span class="gw-world-tags">Software · AI · Web Apps</span>
      <svg class="gw-world-arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg>
    </a>
    <a class="gw-world" href="foundry.html" data-transition>
      <span class="gw-world-num">03</span>
      <span class="gw-world-name">Foundry</span>
      <span class="gw-world-tags">Builds · Experiments · Journal</span>
      <svg class="gw-world-arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg>
    </a>
  </nav>

</main>

<!-- ── FOOTER ── -->
<footer class="gw-foot">
  <span>© 2026 Vyatirikht</span>
  <span class="gw-foot-mid">Studio · Lab · Foundry</span>
  <span>Pune · India</span>
</footer>

<script src="worlds.js" defer></script>
</body>
</html>
